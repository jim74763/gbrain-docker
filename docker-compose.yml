# Self-hosted gbrain, built from source (see Dockerfile) — not an `oven/bun`
# dev image, not `bun install -g gbrain`: this builds the compiled binary
# from the checked-out repo and runs only that binary.
#
# PGLite only — the embedded, zero-config engine. No separate Postgres
# container: the brain's data lives entirely in the gbrain_data volume
# (mounted at $GBRAIN_HOME) via the docker-entrypoint.sh first-run init.
#
#   docker compose up -d --build

services:
  gbrain:
    container_name: gbrain
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3131:3131"
    environment:
      # Extra flags for the first-run `gbrain init` (docker-entrypoint.sh).
      # Only takes effect on a brand-new $GBRAIN_HOME — embedding dimensions
      # are baked into the schema at init time, so switching an EXISTING
      # brain's embedding provider needs `gbrain init --force` (destructive:
      # re-embeds from scratch). Default below routes embeddings through
      # OpenRouter (one key, see docs/integrations/embedding-providers.md).
      GBRAIN_INIT_ARGS: ${GBRAIN_INIT_ARGS:---embedding-model openrouter:openai/text-embedding-3-small}
      GBRAIN_ADMIN_BOOTSTRAP_TOKEN: ${GBRAIN_ADMIN_BOOTSTRAP_TOKEN}
      # Model provider. Set OPENROUTER_API_KEY in .env (one key routes chat
      # + embeddings through OpenRouter to Anthropic/OpenAI/Google/etc. —
      # see docs/integrations/embedding-providers.md). GBRAIN_MODEL picks
      # the chat/reasoning model live, no re-init needed to change it.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GBRAIN_MODEL: ${GBRAIN_MODEL:-openrouter:moonshotai/kimi-k3}
      # Direct-provider keys, as an alternative to OpenRouter. Uncomment what
      # you use (and drop the OpenRouter lines above).
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Required once gbrain sits behind this (or any) reverse proxy, so
      # rate limiting and audit logs see the real client IP instead of the
      # proxy's. See SECURITY.md.
      # GBRAIN_HTTP_TRUST_PROXY: "1"
      # GBRAIN_HTTP_CORS_ORIGIN: https://your.app
    volumes:
      # Persists $GBRAIN_HOME: config, the PGLite database files, tokens,
      # logs. This volume IS the brain — back it up to keep your data.
      - ./gbrain_data:/data
    restart: unless-stopped
